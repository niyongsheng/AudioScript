name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site files
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/og.png
          test -f docs/robots.txt
          test -f docs/sitemap.xml
          test -f docs/llms.txt

      - name: Stage site
        run: |
          mkdir -p _site
          cp docs/index.html docs/og.png docs/robots.txt docs/sitemap.xml docs/llms.txt _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
