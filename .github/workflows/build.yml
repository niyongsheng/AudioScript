name: Build & Release

on:
  push:
    tags: ['v*']
  # SPEC §5.2：首次跑通前 MUST NOT 进发布流程，先手动触发验证整条链
  workflow_dispatch:

jobs:
  build-mac-arm:
    name: Build (macOS ARM)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert arm64 runner
        run: |-
          test "$(uname -m)" = arm64 ||
            { echo "::error::runner 不是 arm64——产物会是 x86_64 却被当成 ARM 发出去，需改用 macos-14 并显式 --target"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 钉版本：torch 要求 Python >= 3.10，runner 自带的 3.9 会让 pip 报「(from versions: none)」
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # tag 构建只恢复不保存：GitHub 缓存按 ref 隔离，下一个 tag 用不上，还会挤占 10 GB 配额
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache sherpa-onnx native libs
        uses: actions/cache@v4
        with:
          path: src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-onnx-1.13.8-${{ runner.os }}-${{ runner.arch }}

      # sherpa-onnx-sys 的 build.rs 只检查 lib/ 目录存在就跳过下载，
      # rust-cache 恢复出空目录时会让链接器找不到 .lib/.a。
      - name: Verify sherpa-onnx native libs
        shell: bash
        run: |-
          found=$(find src-tauri/target/sherpa-onnx-prebuilt -type f \
            \( -name 'sherpa-onnx-c-api.lib' -o -name 'libsherpa-onnx-c-api.a' \) -print -quit 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "::warning::sherpa-onnx 预编译库缺失，清空缓存后重新下载"
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
          fi

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: src-tauri/assets/models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          key: asr-model-v1
          restore-keys: asr-model-
          # 跨平台共享：hashFiles 在 Windows 会因换行符不同算出另一个哈希；换模型时手动升 v2

      - name: Cache MT models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/mt
            .cache/mt
          key: mt-models-v1
          restore-keys: mt-models-

      - name: Install typeshare CLI
        run: typeshare --version 2>/dev/null | grep -q 1.13.4 || cargo install typeshare-cli --version 1.13.4 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch MT models
        run: pnpm fetch:mt

      - name: Build Tauri app (DMG)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.updater.conf.json

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-macOS-ARM
          path: src-tauri/target/release/bundle/dmg/*.dmg
          compression-level: 0

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-macOS-ARM
          path: src-tauri/target/release/bundle/macos/*.app.tar.gz*
          compression-level: 0

  # Windows/Linux 只验证过编译与打包，采集/置顶/托盘/热键未在真机验证。
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # ct2rs/sherpa-onnx 的 CMake 构建用 /MT，Rust 默认 /MD，不对齐会报 LNK2038/LNK1169
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # tag 构建只恢复不保存：GitHub 缓存按 ref 隔离，下一个 tag 用不上，还会挤占 10 GB 配额
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache sherpa-onnx native libs
        uses: actions/cache@v4
        with:
          path: src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-onnx-1.13.8-${{ runner.os }}-${{ runner.arch }}

      # sherpa-onnx-sys 的 build.rs 只检查 lib/ 目录存在就跳过下载，
      # rust-cache 恢复出空目录时会让链接器找不到 .lib/.a。
      - name: Verify sherpa-onnx native libs
        shell: bash
        run: |-
          found=$(find src-tauri/target/sherpa-onnx-prebuilt -type f \
            \( -name 'sherpa-onnx-c-api.lib' -o -name 'libsherpa-onnx-c-api.a' \) -print -quit 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "::warning::sherpa-onnx 预编译库缺失，清空缓存后重新下载"
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
          fi

      - name: Cache typeshare CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-1.13.4-${{ runner.os }}

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: src-tauri/assets/models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          key: asr-model-v1
          restore-keys: asr-model-

      - name: Cache MT models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/mt
            .cache/mt
          key: mt-models-v1
          restore-keys: mt-models-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install typeshare CLI
        shell: bash
        run: typeshare --version 2>/dev/null | grep -q 1.13.4 || cargo install typeshare-cli --version 1.13.4 --locked

      - name: Fetch MT models
        run: pnpm fetch:mt

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis,msi --config src-tauri/tauri.updater.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-Windows-x64
          path: |-
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          compression-level: 0

      - name: Upload NSIS updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe*
          compression-level: 0

      - name: Upload MSI updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-Windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi*
          compression-level: 0

  build-linux:
    name: Build (Linux)
    # ubuntu-26.04 的 GCC 15 / binutils 会让 ct2rs 的 CTranslate2 缺 CpuIsa 0/1 符号，链接失败
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # CI 无 FUSE，AppImage 工具链需解包运行
      APPIMAGE_EXTRACT_AND_RUN: 1
      # 不要删：sherpa-onnx 的 onnxruntime 用旧 C++ ABI，CTranslate2 默认新 ABI，
      # 混链会导致点「开始转写」闪退
      CXXFLAGS: -D_GLIBCXX_USE_CXX11_ABI=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libssl-dev build-essential libxdo-dev \
            libpipewire-0.3-dev cmake ninja-build

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # tag 构建只恢复不保存：GitHub 缓存按 ref 隔离，下一个 tag 用不上，还会挤占 10 GB 配额
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # CXXFLAGS 改了必须换 key，否则会复用按新 ABI 编好的 CTranslate2
          key: cxx-abi-0

      - name: Cache sherpa-onnx native libs
        uses: actions/cache@v4
        with:
          path: src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-onnx-1.13.8-${{ runner.os }}-${{ runner.arch }}

      # sherpa-onnx-sys 的 build.rs 只检查 lib/ 目录存在就跳过下载，
      # rust-cache 恢复出空目录时会让链接器找不到 .lib/.a。
      - name: Verify sherpa-onnx native libs
        shell: bash
        run: |-
          found=$(find src-tauri/target/sherpa-onnx-prebuilt -type f \
            \( -name 'sherpa-onnx-c-api.lib' -o -name 'libsherpa-onnx-c-api.a' \) -print -quit 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "::warning::sherpa-onnx 预编译库缺失，清空缓存后重新下载"
            rm -rf src-tauri/target/sherpa-onnx-prebuilt
          fi

      - name: Cache typeshare CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-1.13.4-${{ runner.os }}

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: src-tauri/assets/models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          key: asr-model-v1
          restore-keys: asr-model-

      - name: Cache MT models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/mt
            .cache/mt
          key: mt-models-v1
          restore-keys: mt-models-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install typeshare CLI
        run: typeshare --version 2>/dev/null | grep -q 1.13.4 || cargo install typeshare-cli --version 1.13.4 --locked

      - name: Fetch MT models
        run: pnpm fetch:mt

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,appimage --config src-tauri/tauri.updater.conf.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-Linux-x64
          path: |-
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 0

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-Linux-x64
          path: src-tauri/target/release/bundle/appimage/*.AppImage*
          compression-level: 0

      - name: Upload deb updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: updater-Linux-x64-deb
          path: src-tauri/target/release/bundle/deb/*.deb*
          compression-level: 0

  release:
    name: Create Release
    needs: [build-mac-arm, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # 每个平台只产出本平台的 .sig，这里合成 updater 所需的单一 latest.json。
      - name: Generate updater manifest
        run: |-
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node scripts/make-updater-manifest.mjs \
            --version "$VERSION" \
            --base-url "$BASE" \
            --platform "darwin-aarch64=$(ls updater-macOS-ARM/*.app.tar.gz)" \
            --platform "darwin-aarch64-app=$(ls updater-macOS-ARM/*.app.tar.gz)" \
            --platform "windows-x86_64=$(ls updater-Windows-x64/*-setup.exe)" \
            --platform "windows-x86_64-nsis=$(ls updater-Windows-x64/*-setup.exe)" \
            --platform "windows-x86_64-msi=$(ls updater-Windows-x64-msi/*.msi)" \
            --platform "linux-x86_64=$(ls updater-Linux-x64/*.AppImage)" \
            --platform "linux-x86_64-appimage=$(ls updater-Linux-x64/*.AppImage)" \
            --platform "linux-x86_64-deb=$(ls updater-Linux-x64-deb/*.deb)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AudioScript ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # upload-artifact 以匹配文件的公共祖先为根，Windows 的 nsis/、msi/ 是子目录；
          # 少一层会报「Pattern ... does not match any files」并让 release 失败。
          files: |
            AudioScript-macOS-ARM/*.dmg
            AudioScript-Windows-x64/nsis/*.exe
            AudioScript-Windows-x64/msi/*.msi
            AudioScript-Linux-x64/deb/*.deb
            AudioScript-Linux-x64/appimage/*.AppImage
            updater-macOS-ARM/*.app.tar.gz
            latest.json
