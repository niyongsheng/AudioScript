name: Build model assets

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '把大模型归档上传到 models-v1 release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-models:
    name: Build optional model assets
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify fork model sources
        run: node scripts/verify-project.mjs

      # fetch-mt-model.mjs 用 python3 -m venv 建环境，torch 要求 >= 3.10。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .cache/ct2venv
          key: ct2venv-${{ runner.os }}-${{ hashFiles('scripts/fetch-mt-model.mjs') }}
          restore-keys: ct2venv-${{ runner.os }}-

      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache/mt
          key: hf-mt-${{ hashFiles('scripts/fetch-mt-model.mjs') }}
          restore-keys: hf-mt-

      # 先产出 ASR 高精度模型的上游 SHA-256 / 体积，供 catalog 使用。
      - name: Build ASR high model
        run: |
          node scripts/fetch-model.mjs --model high --print-catalog | tee asr-high.log
          grep -A6 CATALOG_FRAGMENT asr-high.log

      # 转换 tc-big、打 tar.gz，并输出 SHA-256 / 体积。
      - name: Build MT big model
        run: |
          node scripts/fetch-mt-model.mjs --tier big --print-catalog | tee mt-big.log
          grep -A6 CATALOG_FRAGMENT mt-big.log

      - name: Verify catalog (offline)
        run: node scripts/verify-model-catalog.mjs

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-assets
          path: |
            dist/models/models-v1/*.tar.gz
          compression-level: 0

      - name: Publish to models-v1
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-v1
          name: AudioScript model assets v1
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/models/models-v1/*.tar.gz
